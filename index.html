  <title>Vendo café mayorista en Colombia | Contacto por WhatsApp</title>
  <style>
    :root {
      color-scheme: dark;
      --espresso: #211711;
      --coffee: #593923;
      --cream: #f3e8d4;
      --muted: #c9b69b;
      --green: #526448;
      --deep-green: #364633;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 100%, rgb(114 75 43 / 24%), transparent 48%),
        var(--espresso);
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      position: relative;
      display: grid;
      width: min(1120px, calc(100% - 64px));
      min-height: min(700px, calc(100vh - 64px));
      grid-template-columns: 1.05fr 0.95fr;
      align-items: center;
      overflow: hidden;
      border: 1px solid rgb(243 232 212 / 13%);
      border-radius: 8px;
      background:
        linear-gradient(118deg, rgb(255 255 255 / 2%), transparent 48%),
        #2a1d15;
      box-shadow: 0 34px 100px rgb(0 0 0 / 35%);
    }

    .page::before,
    .page::after {
      position: absolute;
      z-index: 0;
      width: 290px;
      height: 290px;
      border: 1px solid rgb(201 182 155 / 8%);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .page::before {
      top: -190px;
      left: -150px;
      box-shadow: 0 0 0 24px rgb(201 182 155 / 2%), 0 0 0 48px rgb(201 182 155 / 2%);
    }

    .page::after {
      right: -210px;
      bottom: -180px;
      width: 390px;
      height: 390px;
    }

    .copy {
      position: relative;
      z-index: 1;
      padding: 72px 0 72px 78px;
    }

    .bean-mark {
      display: block;
      width: 46px;
      height: 46px;
      margin-bottom: 48px;
      color: #b88959;
    }

    h1 {
      max-width: 560px;
      margin: 0;
      font-size: clamp(3.6rem, 7.5vw, 6.8rem);
      font-weight: 400;
      letter-spacing: -0.075em;
      line-height: 0.91;
    }

    h1 span {
      display: block;
      color: #c99c6b;
      font-style: italic;
      font-weight: 400;
    }

    .contact {
      display: inline-flex;
      min-height: 58px;
      align-items: center;
      gap: 13px;
      margin-top: 48px;
      padding: 0 22px;
      border: 1px solid rgb(243 232 212 / 18%);
      border-radius: 4px;
      background: var(--green);
      color: #fff8eb;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.94rem;
      font-weight: 600;
      letter-spacing: 0.025em;
      text-decoration: none;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .contact:hover {
      transform: translateY(-2px);
      background: var(--deep-green);
    }

    .contact:focus-visible {
      outline: 3px solid #d5aa78;
      outline-offset: 4px;
    }

    .contact svg {
      width: 21px;
      height: 21px;
      flex: 0 0 auto;
    }

    .number {
      display: block;
      margin-top: 18px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(1.3rem, 3.2vw, 1.7rem);
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .tumblr-link {
      display: inline-block;
      margin-top: 22px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-decoration-color: rgb(201 182 155 / 45%);
      text-underline-offset: 4px;
    }

    .tumblr-link:hover {
      color: var(--cream);
    }

    .art {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 560px;
      place-items: center;
    }

    .art::before {
      position: absolute;
      width: min(36vw, 410px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgb(196 145 91 / 22%), rgb(196 145 91 / 5%) 58%, transparent 70%);
      content: "";
    }

    .bag {
      position: relative;
      width: min(300px, 72%);
      filter: drop-shadow(24px 32px 22px rgb(0 0 0 / 36%));
      transform: rotate(3deg);
      animation: settle 800ms ease-out both;
    }

    .bean {
      position: absolute;
      width: 27px;
      height: 39px;
      border: 1px solid rgb(209 163 112 / 54%);
      border-radius: 50%;
      background: linear-gradient(135deg, #71472c, #352218);
      box-shadow: inset 3px 1px 5px rgb(221 177 123 / 20%);
      transform: rotate(36deg);
    }

    .bean::after {
      position: absolute;
      top: 4px;
      left: 12px;
      width: 1px;
      height: 29px;
      border-radius: 50%;
      background: rgb(225 184 131 / 58%);
      content: "";
      transform: rotate(4deg);
    }

    .bean-one {
      top: 20%;
      left: 13%;
      transform: rotate(-32deg) scale(0.82);
    }

    .bean-two {
      right: 12%;
      bottom: 20%;
      transform: rotate(28deg) scale(1.05);
    }

    .bean-three {
      top: 35%;
      right: 3%;
      transform: rotate(-22deg) scale(0.65);
    }

    @keyframes settle {
      from {
        opacity: 0;
        transform: translateY(14px) rotate(0);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotate(3deg);
      }
    }

    @media (max-width: 720px) {
      body {
        overflow: auto;
      }

      .page {
        width: min(100% - 28px, 520px);
        min-height: min(760px, calc(100svh - 28px));
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(210px, 0.8fr);
      }

      .copy {
        padding: 48px 32px 0;
      }

      .bean-mark {
        width: 38px;
        height: 38px;
        margin-bottom: 34px;
      }

      h1 {
        font-size: clamp(3.7rem, 14vw, 5.5rem);
      }

      .contact {
        margin-top: 34px;
      }

      .art {
        min-height: 245px;
      }

      .bag {
        width: min(180px, 42%);
      }

      .bean-one {
        top: 5%;
        left: 18%;
      }

      .bean-two {
        right: 16%;
        bottom: 7%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

</head>
